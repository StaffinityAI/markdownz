name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EuroZig/setup-zig@v3
        with:
          version: 0.17.1

      # `zig build ci` reproduces a run locally.
      - run: zig build ci --summary all
